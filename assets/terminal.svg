  <g class="m">
    <text x="40" y="94"  class="l" style="animation-delay:.2s"><tspan class="r">›</tspan>  whoami</text>
    <text x="40" y="118" class="l" style="animation-delay:.6s"><tspan class="w">Deepanshu</tspan><tspan class="g">  ·  </tspan>final-year undergraduate, IIT Delhi ’27</text>

